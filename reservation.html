<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reserve your table at Brew & Bite Café and enjoy coffee, delicious food, and a cozy atmosphere.">
<title>Reserve a Table | Brew &amp; Bite Café</title>
<link rel="stylesheet" href="style.css">
<style>
    .reservation {
        max-width: 750px;
        margin: 45px auto;
        padding: 35px;
        background: #fffaf4;
        color: #3e2723;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }
    .reservation h1,
    .reservation h2 {
        text-align: center;
        color: #6f4e37;
        margin-bottom: 15px;
    }
    .reservation > p {
        text-align: center;
        margin-bottom: 25px;
        line-height: 1.6;
    }
    .reservation form {
        display: flex;
        flex-direction: column;
    }
    .reservation label {
        margin: 13px 0 7px;
        font-weight: bold;
    }
    .reservation input,
    .reservation select,
    .reservation textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d6c7b8;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        font-family: inherit;
        background: #ffffff;
        color: #3e2723;
    }
    .reservation input:focus,
    .reservation select:focus,
    .reservation textarea:focus {
        outline: 2px solid #b88a60;
        border-color: #6f4e37;
    }
    .reservation textarea {
        resize: vertical;
    }
    .reservation button {
        margin-top: 25px;
        padding: 14px;
        background: #6f4e37;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .reservation button:hover {
        background: #4e342e;
    }
    #reservation-response {
        margin-top: 18px;
        text-align: center;
        line-height: 1.6;
        font-weight: bold;
        color: #287a38;
    }
    .reservation-footer {
        text-align: center;
        padding: 22px 15px;
        background: #3e2723;
        color: white;
        margin-top: 35px;
    }
    .reservation-footer p {
        margin: 8px 0;
    }
    /* Dark mode */
    body.dark-mode .reservation {
        background: #292421;
        color: #f5f0eb;
        border: 1px solid #514237;
    }
    body.dark-mode .reservation h1,
    body.dark-mode .reservation h2 {
        color: #e5b887;
    }
    body.dark-mode .reservation input,
    body.dark-mode .reservation select,
    body.dark-mode .reservation textarea {
        background: #1e1b19;
        color: #ffffff;
        border-color: #625448;
    }
    @media (max-width: 800px) {
        .reservation {
            margin: 25px 15px;
            padding: 25px 20px;
        }
    }
    @media (max-width: 480px) {
        .reservation {
            padding: 20px 15px;
        }
        .reservation h1,
        .reservation h2 {
            font-size: 24px;
        }
    }
</style>
</head>
<body>
<!-- Navigation Header -->
<header class="site-header">
    <nav class="main-nav">
        <a href="index.html" class="brand">
            ☕ Brew <span>&amp; Bite</span>
        </a>
        <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false">
            ☰
        </button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="about.html">About</a>
            <a href="reservation.html" class="active" aria-current="page">Reservation</a>
            <a href="contact.html">Contact</a>
            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle dark and light mode">
                🌙 Dark Mode
            </button>
        </div>
    </nav>
</header>
<!-- Reservation Form -->
<main>
    <section class="reservation">
        <h1>Reserve Your Table ☕</h1>
        <p>
            Book your table and enjoy a delightful café experience!
        </p>
        <form id="reservation-form">
            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                required>
            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>
            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required>
            <label for="date">Reservation Date:</label>
            <input
                type="date"
                id="date"
                name="date"
                required>
            <label for="time">Reservation Time:</label>
            <input
                type="time"
                id="time"
                name="time"
                required>
            <label for="guests">Number of Guests:</label>
            <select id="guests" name="guests" required>
                <option value="">Select guests</option>
                <option value="1">1 Guest</option>
                <option value="2">2 Guests</option>
                <option value="3">3 Guests</option>
                <option value="4">4 Guests</option>
                <option value="5">5 Guests</option>
                <option value="6">6 Guests</option>
            </select>
            <label for="requests">Special Requests:</label>
            <textarea
                id="requests"
                name="requests"
                rows="4"
                placeholder="Any special requests?"></textarea>
            <button type="submit">Book a Table</button>
        </form>
        <p id="reservation-response" role="status" aria-live="polite"></p>
    </section>
</main>
<!-- Footer -->
<footer class="reservation-footer">
    <p>&copy; 2026 Brew &amp; Bite Café. All rights reserved.</p>
    <p>Made with ❤️ and Coffee ☕</p>
</footer>
<!-- JavaScript -->
<script src="script.js"></script>
<script>
    const reservationForm = document.getElementById("reservation-form");
    const reservationResponse = document.getElementById("reservation-response");
    const reservationDate = document.getElementById("date");
    // Prevent selecting a past date.
    const today = new Date();
    const localToday = new Date(
        today.getTime() - today.getTimezoneOffset() * 60000
    ).toISOString().split("T")[0];
    reservationDate.min = localToday;
    // Demo form response.
    reservationForm.addEventListener("submit", function(event) {
        event.preventDefault();
        reservationResponse.textContent =
            "Thank you! Your reservation details have been entered. Please contact the café to confirm your booking.";
        reservationForm.reset();
        reservationDate.min = localToday;
    });
</script>
</body>
</html>
